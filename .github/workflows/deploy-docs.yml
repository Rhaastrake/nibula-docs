name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: Rhaastrake/nibula
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: target

      - name: Replace docs folder
        run: |
          rm -rf target/docs
          mkdir -p target/docs
          cp -r out/* target/docs/
          touch target/docs/.nojekyll

      - name: Commit and push
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          SOURCE_TITLE="$(git log -1 --pretty=%s)"

          cd target
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add docs

          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "docs: new site build from ${SOURCE_REPO}@${SOURCE_SHA::7} (${SOURCE_TITLE})"
          git push