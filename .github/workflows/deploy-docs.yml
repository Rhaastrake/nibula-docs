name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: Rhaastrake/Nibula
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: target

      - name: Replace docs folder
        run: |
          rm -rf target/docs
          mkdir -p target/docs
          cp -r out/* target/docs/
          touch target/docs/.nojekyll

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "docs: rebuild documentation site"
          git push